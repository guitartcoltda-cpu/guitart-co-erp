<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    try {
      // 03/10/2026: restaura a sessão guardada por "Manter conectado" (localStorage) em aba nova
      if (!sessionStorage.getItem('salao_erp_session') && !(function () {
        try {
          var p = JSON.parse(localStorage.getItem('salao_erp_session_persist') || 'null');
          if (p && p.user && p.user.id && (Date.now() - (p.savedAt || 0)) < 15552000000) {
            sessionStorage.setItem('salao_erp_session', JSON.stringify(p.user));
            return true;
          }
        } catch (e) {}
        return false;
      })()) {
        var here = location.pathname.split('/').pop() || 'index.html';
        location.replace('login.html?redirect=' + encodeURIComponent(here));
      }
    } catch (e) {}
  })();
</script>
<script>
  (function () {
    try {
      if (localStorage.getItem('salao_erp_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<title>Folha de Pagamento · Guitart & Co.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" href="assets/img/logo-guitart.png">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>window.PAGE_META = { title: "Folha de Pagamento", subtitle: "Holerite mensal — acesso restrito à administração" };</script>
</head>
<body data-page="folha-pagamento">
  <div id="page-loading-overlay" class="page-loading-overlay">
    <img src="assets/img/logo-guitart.png" alt="Guitart & Co." class="page-loading-logo">
    <div class="page-loading-spinner"></div>
  </div>
  <script>
    setTimeout(function () {
      var ov = document.getElementById("page-loading-overlay");
      if (ov) ov.classList.add("is-hidden");
    }, 8000);
  </script>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-area">
      <div id="topbar-placeholder"></div>
      <main class="page-content">

        <div id="fp-denied" class="card" style="display:none;">
          <div class="card-body"><h3>Acesso restrito</h3><p class="text-muted">A Folha de Pagamento só pode ser vista pela administração.</p></div>
        </div>

        <div id="fp-app">
          <div class="toolbar">
            <div class="toolbar-title">
              <h2>Folha de Pagamento</h2>
              <p>Salário, comissão, vales e descontos legais por funcionário — visível só para a administração</p>
            </div>
            <div class="toolbar-actions">
              <button class="btn btn-outline" id="btn-fp-pdf-all"><i class="fa-solid fa-file-pdf"></i> Holerites de todos (PDF)</button>
            </div>
          </div>

          <div class="filters-bar">
            <div class="form-field"><label>Mês de referência</label><input type="month" id="fp-month"></div>
            <div class="hint" id="fp-hint" style="align-self:center;color:var(--gray-500);font-size:12px;"></div>
          </div>

          <div class="kpi-grid" id="fp-summary" style="margin-bottom:16px;"></div>

          <div class="card">
            <div class="card-header"><div><h3>Folha do mês</h3><div class="card-header-sub" id="fp-sub"></div></div></div>
            <div class="table-wrap"><table class="data-table" id="tbl-folha"></table></div>
          </div>

          <p class="small text-muted" style="margin-top:12px;" id="fp-disclaimer"></p>
        </div>

      </main>
    </div>
  </div>
  <div id="toast-stack"></div>

  <script src="assets/js/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/name-combo.js"></script>
  <script src="assets/js/approvals.js"></script>
  <script src="assets/js/recorrencia.js"></script>
  <script src="assets/js/notificacoes.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/consumo.js"></script>
  <script src="assets/js/comissoes.js"></script>
  <script src="assets/js/ponto-calc.js"></script>
  <script src="assets/js/folha-calc.js"></script>
  <script src="assets/js/folha-pagamento.js"></script>
</body>
</html>

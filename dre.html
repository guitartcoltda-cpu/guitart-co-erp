<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    try {
      if (!sessionStorage.getItem('salao_erp_session')) {
        var here = location.pathname.split('/').pop() || 'index.html';
        location.replace('login.html?redirect=' + encodeURIComponent(here));
      }
    } catch (e) {}
  })();
</script>
<title>Fluxo de Caixa / DRE · Guitart & Co.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" href="assets/img/logo-guitart.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.PAGE_META = { title: "Fluxo de Caixa / DRE", subtitle: "Relatório gerencial consolidado por período e centro de custo" };</script>
</head>
<body data-page="dre">
  <div id="page-loading-overlay" class="page-loading-overlay">
    <img src="assets/img/logo-guitart.png" alt="Guitart & Co." class="page-loading-logo">
    <div class="page-loading-spinner"></div>
  </div>
  <script>
    // Rede de segurança: se por algum motivo o JavaScript da página
    // travar/falhar antes de esconder este overlay (ver layout.js),
    // não deixa a tela presa num carregamento infinito.
    setTimeout(function () {
      var ov = document.getElementById("page-loading-overlay");
      if (ov) ov.classList.add("is-hidden");
    }, 8000);
  </script>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-area">
      <div id="topbar-placeholder"></div>
      <main class="page-content">

        <div class="filters-bar">
          <div class="form-field"><label>Meses no período</label>
            <select id="d-months">
              <option value="3">Últimos 3 meses</option>
              <option value="6" selected>Últimos 6 meses</option>
              <option value="9">Últimos 9 meses</option>
              <option value="12">Últimos 12 meses</option>
              <option value="custom">Personalizado (De / Até)</option>
            </select>
          </div>
          <div class="form-field" id="d-start-field" style="display:none;"><label>De</label><input type="date" id="d-start"></div>
          <div class="form-field" id="d-end-field" style="display:none;"><label>Até</label><input type="date" id="d-end"></div>
          <div class="form-field"><label>Centro de Custo</label><select id="d-cc"><option value="">Todos</option></select></div>
          <button class="btn btn-secondary btn-sm" id="btn-export-dre" style="margin-left:auto;"><i class="fa-solid fa-file-arrow-down"></i> Exportar CSV</button>
        </div>

        <div class="kpi-grid" id="dre-summary" style="margin-bottom:16px;"></div>

        <div class="card mb-16">
          <div class="card-header"><div><h3>Receita, Despesa e Saldo</h3><div class="card-header-sub">Evolução mensal do período selecionado</div></div></div>
          <div class="card-body"><div id="chart-dre-trend"></div></div>
        </div>

        <div class="grid-2 mb-16">
          <div class="card">
            <div class="card-header"><div><h3>Despesas por Centro de Custo</h3><div class="card-header-sub">Total do período</div></div></div>
            <div class="card-body"><div id="chart-dre-cc"></div></div>
          </div>
          <div class="card">
            <div class="card-header"><div><h3>Participação por Centro de Custo</h3><div class="card-header-sub">% sobre as despesas do período</div></div></div>
            <div class="card-body" id="cc-breakdown"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div><h3>DRE Gerencial</h3><div class="card-header-sub">Receitas e despesas por categoria, mês a mês</div></div></div>
          <div class="table-wrap"><table class="data-table" id="tbl-dre"></table></div>
        </div>

      </main>
    </div>
  </div>
  <div id="toast-stack"></div>

  <script src="assets/js/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/approvals.js"></script>
  <script src="assets/js/recorrencia.js"></script>
  <script src="assets/js/notificacoes.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/dre.js"></script>
</body>
</html>

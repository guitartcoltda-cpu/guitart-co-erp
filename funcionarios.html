<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    try {
      if (!sessionStorage.getItem('salao_erp_session')) {
        var here = location.pathname.split('/').pop() || 'index.html';
        location.replace('login.html?redirect=' + encodeURIComponent(here));
      }
    } catch (e) {}
  })();
</script>
<title>Funcionários · Guitart & Co.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" href="assets/img/logo-guitart.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.PAGE_META = { title: "Funcionários", subtitle: "Equipe, cargos, salários e taxas de comissão" };</script>
</head>
<body data-page="funcionarios">
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-area">
      <div id="topbar-placeholder"></div>
      <main class="page-content">

        <div class="toolbar">
          <div class="toolbar-title">
            <h2>Funcionários</h2>
            <p>Cadastro da equipe, cargos, salário fixo e comissão</p>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-primary" id="btn-new-emp"><i class="fa-solid fa-plus"></i> Novo Funcionário</button>
          </div>
        </div>

        <div class="kpi-grid" id="emp-summary" style="margin-bottom:16px;"></div>

        <div class="filters-bar">
          <div class="form-field"><label>Cargo</label><select id="e-role"><option value="">Todos</option></select></div>
          <div class="form-field"><label>Status</label><select id="e-status"><option value="">Todos</option><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></div>
          <div class="form-field ff-grow"><label>Buscar</label><input type="text" id="e-search" placeholder="Nome, e-mail ou telefone..."></div>
        </div>

        <div class="card">
          <div class="table-wrap"><table class="data-table" id="tbl-emp"></table></div>
        </div>

      </main>
    </div>
  </div>
  <div id="toast-stack"></div>

  <script src="assets/js/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/approvals.js"></script>
  <script src="assets/js/recorrencia.js"></script>
  <script src="assets/js/notificacoes.js"></script>
  <script src="assets/js/aniversarios.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/funcionarios.js"></script>
</body>
</html>

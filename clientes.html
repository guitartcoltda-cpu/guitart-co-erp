<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    try {
      if (!sessionStorage.getItem('salao_erp_session')) {
        var here = location.pathname.split('/').pop() || 'index.html';
        location.replace('login.html?redirect=' + encodeURIComponent(here));
      }
    } catch (e) {}
  })();
</script>
<title>Clientes · Guitart & Co.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" href="assets/img/logo-guitart.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.PAGE_META = { title: "Clientes", subtitle: "Cadastro e histórico de atendimentos" };</script>
</head>
<body data-page="clientes">
  <div id="page-loading-overlay" class="page-loading-overlay">
    <img src="assets/img/logo-guitart.png" alt="Guitart & Co." class="page-loading-logo">
    <div class="page-loading-spinner"></div>
  </div>
  <script>
    // Rede de segurança: se por algum motivo o JavaScript da página
    // travar/falhar antes de esconder este overlay (ver layout.js),
    // não deixa a tela presa num carregamento infinito.
    setTimeout(function () {
      var ov = document.getElementById("page-loading-overlay");
      if (ov) ov.classList.add("is-hidden");
    }, 8000);
  </script>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-area">
      <div id="topbar-placeholder"></div>
      <main class="page-content">

        <div class="toolbar">
          <div class="toolbar-title">
            <h2>Clientes</h2>
            <p>Cadastro de clientes e histórico de atendimentos e compras</p>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-primary" id="btn-new-client"><i class="fa-solid fa-plus"></i> Novo Cliente</button>
          </div>
        </div>

        <div class="kpi-grid" id="cli-summary" style="margin-bottom:16px;"></div>

        <div class="filters-bar">
          <div class="form-field"><label>Tag</label><select id="c-tag"><option value="">Todas</option></select></div>
          <div class="form-field ff-grow"><label>Buscar</label><input type="text" id="c-search" placeholder="Nome, telefone ou e-mail..."></div>
        </div>

        <div class="card">
          <div class="table-wrap"><table class="data-table" id="tbl-clients"></table></div>
          <div class="pagination" id="clients-pagination"></div>
        </div>

      </main>
    </div>
  </div>
  <div id="toast-stack"></div>

  <script src="assets/js/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/seed.js"></script>
  <script src="assets/js/approvals.js"></script>
  <script src="assets/js/recorrencia.js"></script>
  <script src="assets/js/notificacoes.js"></script>
  <script src="assets/js/aniversarios.js"></script>
  <script src="assets/js/clientes-quick.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/clientes.js"></script>
</body>
</html>

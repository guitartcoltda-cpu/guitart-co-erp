<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  (function () {
    try {
      if (!sessionStorage.getItem('salao_erp_session')) {
        var here = location.pathname.split('/').pop() || 'index.html';
        location.replace('login.html?redirect=' + encodeURIComponent(here));
      }
    } catch (e) {}
  })();
</script>
<title>Gestão de Ponto · Guitart & Co.</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" href="assets/img/logo-guitart.png">
<link rel="stylesheet" href="assets/css/style.css">
<script>window.PAGE_META = { title: "Gestão de Ponto", subtitle: "Pontos batidos pela equipe, com selfie de conferência" };</script>
</head>
<body data-page="ponto-gestao">
  <div id="page-loading-overlay" class="page-loading-overlay">
    <img src="assets/img/logo-guitart.png" alt="Guitart & Co." class="page-loading-logo">
    <div class="page-loading-spinner"></div>
  </div>
  <script>
    setTimeout(function () {
      var ov = document.getElementById("page-loading-overlay");
      if (ov) ov.classList.add("is-hidden");
    }, 8000);
  </script>
  <div class="app-shell">
    <div id="sidebar-placeholder"></div>
    <div class="main-area">
      <div id="topbar-placeholder"></div>
      <main class="page-content">

        <div class="toolbar">
          <div class="toolbar-title">
            <h2>Gestão de Ponto</h2>
            <p>Confira os pontos batidos pela equipe e as selfies de cada registro</p>
          </div>
          <div class="toolbar-actions">
            <button class="btn btn-outline" id="btn-folha-ponto"><i class="fa-solid fa-file-pdf"></i> Gerar Folha de Ponto</button>
            <button class="btn btn-primary" id="btn-new-manual-entry"><i class="fa-solid fa-pen"></i> Lançar Ponto Manual</button>
          </div>
        </div>

        <div class="kpi-grid" id="pg-summary" style="margin-bottom:16px;"></div>

        <div id="pg-requests-card" class="card mb-16" style="display:none;">
          <div class="card-header"><h3>Solicitações de Ajuste de Ponto</h3><div class="card-header-sub">Pedidas pelo próprio funcionário na tela de Ponto</div></div>
          <div class="card-body"><div id="pg-requests-list"></div></div>
        </div>

        <div id="pg-occorrencias-card" class="card mb-16" style="display:none;">
          <div class="card-header"><h3>Ocorrências Recentes</h3><div class="card-header-sub">Faltas justificadas, atestados, folgas/abonos já aprovados</div></div>
          <div class="card-body"><div id="pg-occorrencias-list"></div></div>
        </div>

        <div id="pg-missing-card" class="card mb-16" style="display:none;">
          <div class="card-header"><h3>Ainda não bateram entrada hoje</h3></div>
          <div class="card-body"><div id="pg-missing-list"></div></div>
        </div>

        <div class="filters-bar">
          <div class="form-field"><label>Funcionário</label><select id="pg-employee"><option value="">Todos</option></select></div>
          <div class="form-field"><label>De</label><input type="date" id="pg-start"></div>
          <div class="form-field"><label>Até</label><input type="date" id="pg-end"></div>
          <div class="form-field"><label>Tipo</label><select id="pg-type">
            <option value="">Todos</option>
            <optgroup label="Batida de Ponto">
              <option value="entrada">Entrada</option>
              <option value="saida_almoco">Saída para Almoço</option>
              <option value="volta_almoco">Volta do Almoço</option>
              <option value="saida">Saída</option>
            </optgroup>
            <optgroup label="Ocorrência">
              <option value="falta_justificada">Falta Justificada</option>
              <option value="atestado">Atestado Médico</option>
              <option value="folga_abono">Folga / Abono</option>
              <option value="outro">Outra Ocorrência</option>
            </optgroup>
          </select></div>
          <div class="form-field checkbox-wrap" style="align-self:flex-end;"><input type="checkbox" id="pg-only-flagged"><label for="pg-only-flagged" style="font-weight:600;">Só sinalizados</label></div>
          <button class="btn btn-secondary btn-sm" id="pg-clear-filters">Limpar Filtros</button>
        </div>

        <div id="pg-espelho-card" class="card mb-16" style="display:none;"></div>

        <div class="card">
          <div class="card-header"><div><h3>Registros</h3><div class="card-header-sub" id="pg-count-sub"></div></div></div>
          <div class="table-wrap"><table class="data-table" id="tbl-ponto"></table></div>
        </div>

      </main>
    </div>
  </div>
  <div id="toast-stack"></div>

  <script src="assets/js/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/ponto-calc.js"></script>
  <script src="assets/js/approvals.js"></script>
  <script src="assets/js/ponto-ajustes.js"></script>
  <script src="assets/js/recorrencia.js"></script>
  <script src="assets/js/notificacoes.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/ponto-gestao.js"></script>
</body>
</html>
